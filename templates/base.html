<!doctype html>
<html lang="{{ language }}" dir="{{ 'rtl' if is_hebrew else 'ltr' }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173b32"><title>{% block title %}Yeshiva Dining Feedback{% endblock %}</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b25;background:#f4f7f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#173b32;color:white;padding:1rem 1.2rem}.nav{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:1rem}.nav-right{display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}.brand{font-weight:750;color:white;text-decoration:none}.nav a{color:white;text-decoration:none}.lang-form{display:inline-flex;margin:0}.lang-btn{background:#fff;color:#173b32;border:1px solid #dce6e0;border-radius:8px;padding:.45rem .7rem;font:inherit;font-weight:650;cursor:pointer}.nav .admin-link{color:#fff}main{width:min(100% - 2rem,900px);margin:2rem auto 4rem}.hero{padding:2rem 0 1rem}h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.15;margin:.3rem 0 1rem}h2{margin-top:0}p{line-height:1.65}.muted{color:#5a6b64}.card{background:white;border:1px solid #dce6e0;border-radius:16px;padding:1.25rem;margin:1rem 0;box-shadow:0 5px 20px #173b3208}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}.btn{display:inline-block;background:#17634d;color:white;text-decoration:none;border:0;border-radius:10px;padding:.85rem 1.1rem;font:inherit;font-weight:650;cursor:pointer}.btn.secondary{background:#e5eee9;color:#173b32}.field{margin:1.1rem 0}.field label,.field legend{display:block;font-weight:650;margin-bottom:.5rem}input,select,textarea{width:100%;padding:.8rem;border:1px solid #b8c9bf;border-radius:9px;background:white;font:inherit;color:inherit}textarea{min-height:110px;resize:vertical}.rating{display:flex;gap:.55rem;flex-wrap:wrap}.rating label{display:flex;gap:.3rem;align-items:center;border:1px solid #dce6e0;border-radius:9px;padding:.55rem .75rem;font-weight:400;cursor:pointer}.rating input{width:auto}.notice{padding:.85rem 1rem;border-radius:10px;background:#fff3d7;margin:1rem 0}.notice.error{background:#ffe8e5}.stat{font-size:1.7rem;font-weight:750}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:start;padding:.75rem;border-bottom:1px solid #e0e8e3;vertical-align:top}th{background:#f0f5f2}.small{font-size:.9rem}footer{text-align:center;color:#6b7a73;padding:1.5rem}.honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}@media(max-width:600px){main{width:min(100% - 1rem,900px);margin-top:1rem}.card{padding:1rem}.nav{flex-wrap:wrap}}
</style></head><body><header><nav class="nav"><a class="brand" href="{{ url_for('index') }}">{{ t.site_name }}</a><div class="nav-right">{% if admin_logged_in %}<a class="admin-link" href="{{ url_for('admin_dashboard') }}">{{ t.admin_dashboard }}</a>{% endif %}<form class="lang-form" method="post" action="{{ url_for('set_language') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="language" value="{{ 'en' if is_hebrew else 'he' }}"><input type="hidden" name="next" value="{{ request.full_path if request.query_string else request.path }}"><button class="lang-btn" type="submit" lang="{{ 'en' if is_hebrew else 'he' }}" aria-label="{{ t.language_label }}">{{ t.switch_language }}</button></form></div></nav></header><main>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="notice {{ 'error' if category == 'error' else '' }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><footer class="small">Yeshiva Dining Feedback · {{ current_year }}</footer></body></html>
