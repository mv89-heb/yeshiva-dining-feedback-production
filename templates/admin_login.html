{% extends "base.html" %}{% block title %}{{ t.admin_login }}{% endblock %}{% block content %}<section class="hero"><p class="muted">{{ t.management }}</p><h1>{{ t.admin_login }}</h1><p>{{ t.admin_login_intro }}</p></section><form class="card" method="post" action="{{ url_for('admin_login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="username">{{ t.username }}</label><input id="username" name="username" autocomplete="username" required maxlength="100"></div><div class="field"><label for="password">{{ t.password }}</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">{{ t.sign_in }}</button></form>{% endblock %}
