<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ code }} · Dining Hall Feedback</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 text-slate-900">
<main class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest text-amber-700">Dining Hall Feedback</p>
  <h1 class="mt-4 text-5xl font-black">{{ code }}</h1>
  <p class="mt-4 leading-7 text-slate-600">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="mt-7 inline-flex min-h-12 items-center justify-center rounded-xl bg-slate-900 px-6 py-3 font-semibold text-white hover:bg-slate-700">Return to feedback form</a>
</main>
</body>
</html>
