name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the exact commit and verify public and protected routes
        env:
          BASE_URL: https://yeshiva-dining-feedback-production.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          base = os.environ["BASE_URL"].rstrip("/")
          expected_commit = os.environ["EXPECTED_COMMIT"]
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def request(path, data=None, headers=None, timeout=15):
              req = urllib.request.Request(base + path, data=data, headers={"User-Agent": "YeshivaDining-SmokeTest/2.0", **(headers or {})})
              try:
                  with opener.open(req, timeout=timeout) as response:
                      return response.status, response.geturl(), response.headers, response.read(200_000)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.geturl(), exc.headers, exc.read(200_000)

          last_error = None
          for _ in range(36):
              try:
                  health = request("/health")
                  ready = request("/ready")
                  health_data = json.loads(health[3]) if health[0] == 200 else {}
                  if health_data.get("commit") == expected_commit and health_data.get("branch") == "main" and ready[0] == 200:
                      break
                  last_error = f"deployed commit={health_data.get('commit')}, branch={health_data.get('branch')}, ready={ready[0]}"
              except Exception as exc:
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(f"Production did not deploy expected commit {expected_commit}: {last_error}")

          assert health_data.get("status") == "ok", "health endpoint failed"
          assert json.loads(ready[3]).get("status") == "ready", "database readiness failed"
          feedback = request("/feedback")
          assert feedback[0] == 200, f"feedback page returned HTTP {feedback[0]}"
          assert b'<html lang="en" dir="ltr">' in feedback[3], "English should be the default language"
          assert b'id="student-feedback-form"' in feedback[3], "student form missing"
          assert b'id="main-dishes"' in feedback[3] and b'id="side-dishes"' in feedback[3], "multi-dish containers missing"
          assert b'name="portion_rating"' in feedback[3], "portion rating missing"
          assert b'id="retry-menu"' in feedback[3], "menu retry control missing"
          assert b'student-feedback.js' in feedback[3], "student interaction script missing"
          assert any(cookie.name == "dining_respondent" for cookie in jar), "anonymous browser cookie missing"

          today = datetime.now(ZoneInfo("Asia/Jerusalem")).date().isoformat()
          menu = request("/api/menu?date=" + today + "&meal_type=lunch")
          assert menu[0] == 200, f"menu API returned HTTP {menu[0]}"
          menu_data = json.loads(menu[3])
          assert menu_data.get("date") == today and menu_data.get("meal_type") == "lunch", "menu API returned wrong meal context"
          assert isinstance(menu_data.get("configured"), bool) and isinstance(menu_data.get("dishes"), list), "menu API response shape invalid"
          student_js = request("/static/student-feedback.js")
          assert student_js[0] == 200 and b"AbortController" in student_js[3], "student menu script missing race protection"

          csrf_match = re.search(rb'name="csrf_token" value="([^"]+)"', feedback[3])
          assert csrf_match, "feedback CSRF token missing"
          def switch_language(language, token):
              payload = urllib.parse.urlencode({"csrf_token": token.decode("ascii"), "language": language, "next": "/feedback"}).encode()
              status, _, _, body = request("/language", data=payload, headers={"Content-Type": "application/x-www-form-urlencoded", "Referer": base + "/feedback"})
              assert status == 200, f"language switch to {language} failed: HTTP {status}"
              return body
          hebrew = switch_language("he", csrf_match.group(1))
          assert b'<html lang="he" dir="rtl">' in hebrew, "Hebrew mode did not set RTL direction"
          assert "איך הייתה הארוחה?".encode("utf-8") in hebrew, "Hebrew translation missing"
          hebrew_csrf = re.search(rb'name="csrf_token" value="([^"]+)"', hebrew)
          assert hebrew_csrf, "Hebrew CSRF token missing"
          english = switch_language("en", hebrew_csrf.group(1))
          assert b'<html lang="en" dir="ltr">' in english, "English mode did not restore LTR direction"

          login = request("/admin/login")
          assert login[0] == 200 and b'name="username"' in login[3] and b'name="password"' in login[3], "manager login form missing"
          for path, label in [("/admin", "admin dashboard"), ("/admin/menu", "menu editor"), ("/api/admin/menu?scope=weekly&weekday=0&meal_type=lunch", "admin menu API"), ("/admin/qr.png", "QR endpoint")]:
              protected = request(path)
              assert protected[0] == 200 and protected[1].rstrip("/").endswith("/admin/login"), f"{label} is not protected (final HTTP {protected[0]} at {protected[1]})"

          print("PASS: exact deployed commit, health/readiness, student form, menu API, JS asset, EN/HE direction, and protected manager routes.")
          print("Read-only: no student feedback was submitted.")
          PY
