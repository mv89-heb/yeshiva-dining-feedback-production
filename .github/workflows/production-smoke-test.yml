name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production endpoints and test access boundaries
        env:
          BASE_URL: https://yeshiva-dining-feedback-production.onrender.com
        run: |
          python - <<'PY'
          import http.cookiejar
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def get(path, timeout=15):
              req = urllib.request.Request(base + path, headers={"User-Agent": "YeshivaDining-SmokeTest/1.0"})
              try:
                  with opener.open(req, timeout=timeout) as response:
                      return response.status, response.geturl(), response.headers, response.read(200_000)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.geturl(), exc.headers, exc.read(200_000)

          last_error = None
          for attempt in range(36):
              try:
                  health = get("/health")
                  ready = get("/ready")
                  feedback = get("/feedback")
                  language_switch_ready = b'name="language"' in feedback[3] and b'<html lang="en" dir="ltr">' in feedback[3]
                  if health[0] == 200 and ready[0] == 200 and feedback[0] == 200 and language_switch_ready:
                      break
                  last_error = f"/health={health[0]}, /ready={ready[0]}, /feedback={feedback[0]}, language_switch={language_switch_ready}"
              except Exception as exc:
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(f"Production did not become ready after retries: {last_error}")

          assert b'"status": "ok"' in health[3] or b'"status":"ok"' in health[3], "health endpoint did not return expected JSON"
          assert b'"status": "ready"' in ready[3] or b'"status":"ready"' in ready[3], "database readiness check did not pass"
          assert b'name="csrf_token"' in feedback[3], "feedback form or CSRF token missing"
          assert any(cookie.name == "dining_respondent" for cookie in jar), "anonymous browser token cookie was not set"
          assert b"Tell us about your meal" in feedback[3], "English should be the default language"

          csrf_match = re.search(rb'name="csrf_token" value="([^"]+)"', feedback[3])
          assert csrf_match, "language switch CSRF token missing"
          def switch_language(language):
              payload = urllib.parse.urlencode({
                  "csrf_token": csrf_match.group(1).decode("ascii"),
                  "language": language,
                  "next": "/feedback",
              }).encode()
              req = urllib.request.Request(base + "/language", data=payload, headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "User-Agent": "YeshivaDining-SmokeTest/1.0",
              })
              with opener.open(req, timeout=15) as response:
                  assert response.status == 200, f"language switch to {language} failed"
                  return response.read(200_000)

          hebrew_feedback = switch_language("he")
          assert b'<html lang="he" dir="rtl">' in hebrew_feedback, "Hebrew mode did not set RTL direction"
          assert "ספרו לנו על הארוחה".encode("utf-8") in hebrew_feedback, "Hebrew translation missing"
          hebrew_csrf = re.search(rb'name="csrf_token" value="([^"]+)"', hebrew_feedback)
          assert hebrew_csrf, "Hebrew form CSRF token missing"
          csrf_match = hebrew_csrf
          english_feedback = switch_language("en")
          assert b'<html lang="en" dir="ltr">' in english_feedback, "English mode did not restore LTR direction"
          assert b"Tell us about your meal" in english_feedback, "English translation missing"

          login = get("/admin/login")
          assert login[0] == 200, f"admin login is not configured correctly: HTTP {login[0]}"
          assert b'name="username"' in login[3] and b'name="password"' in login[3], "admin login form missing credentials fields"

          admin = get("/admin")
          assert admin[0] == 200 and admin[1].rstrip("/").endswith("/admin/login"), "admin dashboard was not protected by login"
          qr = get("/admin/qr.png")
          assert qr[0] == 200 and qr[1].rstrip("/").endswith("/admin/login"), "QR endpoint was not protected by login"

          print("PASS: health/readiness, anonymous feedback form, English default, English↔Hebrew switching with correct text and RTL/LTR direction, manager login, and protected admin/QR endpoints.")
          print("No feedback was submitted; the smoke test is read-only.")
          PY
